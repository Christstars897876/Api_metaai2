<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Delfa API - Easy-to-Use API Documentation Dashboard" />
  <meta name="theme-color" content="#121212" />
  <title>API Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as=\"style\" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />

  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { 
            sans: ['Inter', 'system-ui', 'sans-serif'] 
          },
          colors: {
            dark: {
              bg: '#121212',
              surface: '#1e1e1e',
              border: '#2d2d2d'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-dark-bg dark:text-gray-100 transition-colors duration-200">
  <div id="app" class="min-h-screen flex flex-col">
    <header class="p-4 border-b border-gray-200 dark:border-dark-border flex justify-between items-center bg-white dark:bg-dark-surface">
      <h1 class="text-xl font-bold" id="title-placeholder">API Dashboard</h1>
      <button id="notificationButton" class="relative p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800">
        <span class="material-icons-round">notifications</span>
        <span id="notification-badge" class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full hidden"></span>
      </button>
    </header>

    <main class="flex-1 p-6 max-w-7xl w-full mx-auto">
      <div class="grid gap-6 md:grid-cols-2">
        <div class="p-6 bg-white dark:bg-dark-surface rounded-xl border border-gray-200 dark:border-dark-border">
          <h2 class="text-lg font-semibold flex items-center gap-2"><span class="material-icons-round text-blue-500">smart_toy</span> Chatbot Text AI</h2>
          <p class="text-sm text-gray-500 mt-2">Powered officially by OpenAI gpt-4o-mini.</p>
          <a href="/api/gpt?q=Hello" target="_blank" class="mt-4 inline-block text-xs font-semibold bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">Test Text API</a>
        </div>
        <div class="p-6 bg-white dark:bg-dark-surface rounded-xl border border-gray-200 dark:border-dark-border">
          <h2 class="text-lg font-semibold flex items-center gap-2"><span class="material-icons-round text-purple-500">image</span> Image Generation AI</h2>
          <p class="text-sm text-gray-500 mt-2">Powered officially by OpenAI DALL-E.</p>
          <a href="/api/art?prompt=A beautiful landscape" target="_blank" class="mt-4 inline-block text-xs font-semibold bg-purple-500 text-white px-4 py-2 rounded-lg hover:bg-purple-600">Test Image API</a>
        </div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      fetch('/config')
        .then(res => res.json())
        .then(config => {
          document.title = config.name + " - " + config.version;
          document.getElementById('title-placeholder').textContent = config.name;
          
          const notificationBadge = document.getElementById('notification-badge');
          if(config.notifications && config.notifications.length > 0) {
            notificationBadge.classList.remove('hidden');
          }
        })
        .catch(err => console.error('Failed to load config:', err));
    });
  </script>
</body>
</html>
